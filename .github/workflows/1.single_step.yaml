name: First Action - Single

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        type: boolean
        description: Debug
        default: false
        required: false
      sample_value:
        type: string
        description: Cualquier valor
        default: ""
        required: false   
 

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Hello World
        run: echo "Hello, world!"
      - name: Bye World 
        run: echo "Bye World!"

  hello-Vicent:
    runs-on: ubuntu-latest
    needs: hello-world

    steps:
      - name: Hello World
        run: echo "Hello, Vicent!"
      - name: Bye World 
        run: echo "Bye Vicent!"
